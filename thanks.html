<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're in | Caspian Diabesity Expo 2026</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',sans-serif;background:#0C1D38;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px}
.card{max-width:560px;background:#12294B;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:48px 40px}
.tick{width:72px;height:72px;border-radius:50%;background:#C6A02E;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#0C1D38;font-weight:700}
h1{font-family:'Fraunces',serif;font-size:1.9rem;margin:0 0 12px}
p{color:#C9D6E8;font-size:.95rem;line-height:1.6;margin:0 0 10px}
.pid{background:rgba(255,255,255,.07);border-radius:10px;padding:10px 14px;font-size:.85rem;margin:18px 0;word-break:break-all}
a.btn{display:inline-block;margin-top:18px;background:#C6A02E;color:#0C1D38;font-weight:600;text-decoration:none;padding:13px 26px;border-radius:999px}
</style>
</head>
<body>
<div class="card">
  <div class="tick">✓</div>
  <h1 id="h">You're in. See you on 14 November.</h1>
  <p id="msg">Your pass is confirmed and your payment receipt is on its way from Razorpay. Save your payment ID below and show it at the priority gate.</p>
  <div class="pid" id="pid"></div>
  <p>Questions? WhatsApp us at +91 89193 41154.</p>
  <a class="btn" href="/">Back to the expo site</a>
</div>
<script>
const q = new URLSearchParams(location.search);
const pass = q.get('pass'); const pid = q.get('pid');
const names = { priority: 'Priority Pass', family: 'Family Pass' };
if (pass && names[pass]) document.getElementById('h').textContent = names[pass] + ' confirmed. See you on 14 November.';
document.getElementById('pid').textContent = pid ? ('Payment ID: ' + pid) : '';
</script>
</body>
</html>
